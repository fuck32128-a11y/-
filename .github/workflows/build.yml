name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q popstar_player.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: popstar_player
        run: |
          flutter create --platforms=android --org com.popstar --project-name popstar_player _tmp
          cp -r _tmp/android ./android
          rm -rf _tmp

      - name: Patch Android project
        run: bash popstar_player/tools/patch_android.sh

      - name: Get packages
        working-directory: popstar_player
        run: flutter pub get

      - name: Build release APK
        working-directory: popstar_player
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: popstar-apk
          path: popstar_player/build/app/outputs/flutter-apk/app-release.apk
